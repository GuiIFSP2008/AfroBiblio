<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | AfroBiblio</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="icon" href="../imagens/iconepag.jpg" type="image/x-icon">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="../imagens/iconepag.jpg" alt="Ícone AfroBiblio" class="logo-icon">
                <h1>AfroBiblio</h1>
            </div>

            <h2>Crie sua conta</h2>
            <p class="descricao">Junte-se à nossa comunidade e ajude a preservar a literatura africana.</p>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais" placeholder="Ex: Brasil, Angola, Cabo Verde">
                </div>


                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita sua senha"
                        required>
                </div>

                <button type="submit" class="botao">Cadastrar</button>

                <p class="cadastro-texto">
                    Já tem uma conta? <a href="/login">Faça login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.querySelector("form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();
            const pais = document.getElementById("pais").value.trim();


            const resposta = await fetch("/cadastro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, email, senha, pais }),
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                alert(dados.mensagem);
                window.location.href = "/login";
            } else {
                alert(dados.erro || "Erro ao cadastrar. Tente novamente.");
            }
        });
    </script>


</body>

</html>
